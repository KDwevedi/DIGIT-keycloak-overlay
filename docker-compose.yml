services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  keycloak:
    image: digit-keycloak-magic-link:26.7.3-0.75
    build:
      context: .
      dockerfile: keycloak/Dockerfile.magic-link
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: http://localhost:18180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8180
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "18180:8180"

  identity-bff:
    build: .
    command: ["node", "dist/app/server.js"]
    environment:
      PORT: 3000
      KEYCLOAK_ISSUER: http://localhost:18180/realms/digit-sandbox
      KEYCLOAK_OIDC_BACKCHANNEL_URL: http://keycloak:8180/realms/digit-sandbox
      KEYCLOAK_JWKS_URI: http://keycloak:8180/realms/digit-sandbox/protocol/openid-connect/certs
      KEYCLOAK_BFF_CLIENT_ID: digit-identity-bff
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET:-dev-only-change-me}
      KEYCLOAK_BFF_AUDIENCE: digit-identity-bff
      KEYCLOAK_MAGIC_LINK_CLIENT_ID: digit-identity-bff-magic-link
      KEYCLOAK_MAGIC_LINK_CLIENT_SECRET: ${KEYCLOAK_MAGIC_LINK_CLIENT_SECRET:-dev-only-magic-link-change-me}
      KEYCLOAK_ADMIN_URL: http://keycloak:8180
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_ORGANIZATION_REALM: digit-sandbox
      KEYCLOAK_ALLOWED_ORG_ROLE_CLIENTS: digit-ui
      IDENTITY_REDIRECT_URI: http://localhost:18201/identity/v1/callback
      IDENTITY_POST_LOGIN_REDIRECT: http://localhost:3000/
      IDENTITY_ALLOWED_ORIGIN: http://localhost:3000
      IDENTITY_COOKIE_SECURE: "false"
      IDENTITY_AUTH_METHODS: '[{"id":"password","label":"Email and password","type":"password"},{"id":"magic_link","label":"Email me a sign-in link","type":"magic_link"}]'
      IDENTITY_CONTROL_PLANE_TOKEN: ${IDENTITY_CONTROL_PLANE_TOKEN:-local-control-plane-token}
      DIGIT_IDENTITY_SERVICE_URL: ${DIGIT_IDENTITY_SERVICE_URL:-}
      DIGIT_IDENTITY_SERVICE_TOKEN: ${DIGIT_IDENTITY_SERVICE_TOKEN:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "18201:3000"
    depends_on:
      - redis
      - keycloak
