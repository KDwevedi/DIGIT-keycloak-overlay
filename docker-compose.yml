services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8180
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "18180:8180"

  token-exchange-svc:
    build: .
    environment:
      DIGIT_USER_HOST: http://host.docker.internal:8107
      DIGIT_SYSTEM_USERNAME: INTERNAL_MICROSERVICE_ROLE
      DIGIT_SYSTEM_PASSWORD: eGov@123
      DIGIT_SYSTEM_TENANT: pg
      DIGIT_DEFAULT_TENANT: pg.citya
      KEYCLOAK_ISSUER: http://keycloak:8180/realms/digit-sandbox
      KEYCLOAK_JWKS_URI: http://keycloak:8180/realms/digit-sandbox/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: digit-sandbox-ui
      KEYCLOAK_BFF_CLIENT_ID: digit-identity-bff
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET:-dev-only-change-me}
      KEYCLOAK_BFF_AUDIENCE: digit-identity-bff
      KEYCLOAK_ORG_TENANT_MAPPINGS: "[]"
      IDENTITY_REDIRECT_URI: http://localhost:18200/identity/v1/callback
      IDENTITY_POST_LOGIN_REDIRECT: http://localhost:3000/
      IDENTITY_ALLOWED_ORIGIN: http://localhost:3000
      IDENTITY_COOKIE_SECURE: "false"
      KEYCLOAK_ADMIN_URL: http://keycloak:8180
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      TENANT_SYNC_ENABLED: "true"
      DIGIT_MDMS_HOST: ""
      DIGIT_TENANTS: "pg:pg.citya,pg.cityb"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "18200:3000"
    depends_on:
      - redis
      - keycloak
