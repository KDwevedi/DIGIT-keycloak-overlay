services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    environment:
      KC_HOSTNAME: https://bometfeedbackhub.digit.org/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  identity-bff:
    image: digit-identity-bff:bomet-2a73e0d
    container_name: digit-identity-bff
    command:
      - node
      - --import
      - ./dist/instrumentation.js
      - dist/identity-server.js
    restart: unless-stopped
    env_file:
      - /opt/digit/identity-bff.env
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18400:3000"
    networks:
      - egov-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
